# Each key is documented by a metadata line placed just above it:
#     ### type :: one-line documentation
# where type is one of: int, float, bool, str, an enumeration 'v1|v2|...'
# or a deprecation: 'deprecated -> section.key' (redirected to its replacement) or 'deprecated type' (without
# replacement: the key keeps its type and its value), documented by 'deprecated after <last tag with the key>'.
# An int or a float may be followed by its domain of validity: a bracket turned toward a bound includes it,
# turned away excludes it, an omitted bound is unbounded. Examples: float]0,1[ (0 and 1 excluded),
# int[1,] (at least 1), int[0,100], float]0,] (strictly positive). A value out of its domain is refused.
# uint32 is an int in the range of a 32-bit unsigned integer, i.e. int[0,4294967295].

[core]
### int :: default maximum number of threads used by aGrUM (-1 = adapted to the machine)
maxNumberOfThreads = -1
### uint32 :: seed of the random generator at start (0 = the clock), read once: use initRandom() to act directly on the generator
randomSeed = 0
### int :: default indentation when exporting a model to JGum (-1 = compact)
jgumIndent = -1
### bool :: allow to fix syntax errors in a model instead of raising when exporting to external format (BIF, etc.)
allowModificationWhenSaving = False
### float[1e-3,1e-1] :: coarse numerical tolerance, in [1e-3,1e-1] (threshold of error of the checks of a model)
epsilonCoarse = 1e-2
### float[1e-8,1e-5] :: standard numerical tolerance, in [1e-8,1e-5] (sums of probabilities, comparisons of tensors, credal sets)
epsilonStandard = 1e-6
### float[1e-11,1e-9] :: fine numerical tolerance, in [1e-11,1e-9] (low-level arithmetic, comparisons of ticks, numerical stability)
epsilonFine = 1e-10

# keys renamed after aGrUM 3.2.1 (no more 'default_' prefix, camelCase), kept for compatibility
### deprecated -> core.maxNumberOfThreads :: deprecated after 3.2.1 (prefix 'default_' removed)
default_maxNumberOfThreads = -1
### deprecated -> core.jgumIndent :: deprecated after 3.2.1 (prefix 'default_' removed)
default_jgumIndent = -1
### deprecated -> core.allowModificationWhenSaving :: deprecated after 3.2.1 (camelCase)
allow_modification_when_saving = False

# Default parameters of the approximation schemes (iterative algorithms). Every scheme starts with the values of its own
# section ; the section 'approximation' gives the values of the schemes that have no section of their own.
[approximation]
### float[0,] :: default threshold on the error to stop an approximation scheme
epsilon = 0.05
### float[0,] :: default threshold on the rate of the error to stop an approximation scheme
minEpsilonRate = 0.01
### int[1,] :: default maximum number of iterations of an approximation scheme
maxIter = 10000
### float]0,] :: default maximum time (in seconds) of an approximation scheme (the timeout is disabled until it is set)
maxTime = 1.0
### int[0,] :: default number of iterations before the stopping criteria are checked
burnIn = 0
### int[1,] :: default number of iterations between two checks of the stopping criteria
periodSize = 1
### bool :: default verbosity (history of the errors) of an approximation scheme
verbosity = False

[sampling]
### int[1,] :: default maximum number of iterations of the sampling inference engines (Monte Carlo, Weighted, Importance, Gibbs)
maxIter = 10000000
### float[0,] :: default threshold on the error to stop the sampling inference engines
epsilon = 0.01
### float]0,] :: default maximum time (in seconds) of the sampling inference engines
maxTime = 6000.0
### int[1,] :: default number of samples between two checks of the stopping criteria of the sampling inference engines
periodSize = 100
### float[0,] :: default threshold on the rate of the error to stop the sampling inference engines
minEpsilonRate = 1e-5
### bool :: default verbosity of the sampling inference engines
verbosity = False
### int[1,] :: default maximum number of consecutive draws rejected by the hard evidence before a sampler (Monte Carlo, Weighted, Importance, database generator) concludes that the evidence has a null or too small probability
maxConsecutiveRejections = 1000000

[gibbs]
### float[0,] :: default threshold on the error to stop the Gibbs sampling inference engine
epsilon = 0.01
### float[0,] :: default threshold on the rate of the error to stop the Gibbs sampling inference engine
minEpsilonRate = 1e-5
### int[0,] :: default number of samples dropped at the beginning of a Gibbs sampling
burnIn = 300
### int[0,100] :: default percentage of the variables drawn between two samples of a Gibbs sampling (0 to 100)
percentDrawnSample = 50
### bool :: default way to choose the variables drawn in a Gibbs sampling (at random or in turn)
drawnAtRandom = True

[lbp]
### int[1,] :: default maximum number of iterations of the loopy belief propagation
maxIter = 100
### float[0,] :: default threshold on the error to stop the loopy belief propagation
epsilon = 1e-8
### float[0,] :: default threshold on the rate of the error to stop the loopy belief propagation
minEpsilonRate = 1e-10
### int[1,] :: default number of iterations between two checks of the stopping criteria of the loopy belief propagation
periodSize = 1
### bool :: default verbosity of the loopy belief propagation
verbosity = False

[loopySampling]
### int[1,] :: default size of the virtual sample given by the loopy belief propagation to the hybrid sampling inference engines
virtualLBPSize = 5000

[gibbsKL]
### int[1,] :: default maximum number of iterations of the Kullback-Leibler divergence computed by Gibbs sampling
maxIter = 10000000
### float[0,] :: default threshold on the error to stop the Gibbs computation of the Kullback-Leibler divergence
epsilon = 1e-5
### float[0,] :: default threshold on the rate of the error to stop the Gibbs computation of the Kullback-Leibler divergence
minEpsilonRate = 1e-10
### int[1,] :: default number of samples between two checks of the stopping criteria of the Gibbs computation of the Kullback-Leibler divergence
periodSize = 200
### bool :: default verbosity of the Gibbs computation of the Kullback-Leibler divergence
verbosity = False
### int[0,] :: default number of samples dropped at the beginning of the Gibbs computation of the Kullback-Leibler divergence
burnIn = 2000
### float]0,] :: default maximum time (in seconds) of the Gibbs computation of the Kullback-Leibler divergence
maxTime = 6000.0
### int[0,100] :: default percentage of the variables drawn between two samples of the Gibbs computation of the Kullback-Leibler divergence (0 to 100)
percentDrawnSample = 10
### bool :: default way to choose the variables drawn in the Gibbs computation of the Kullback-Leibler divergence (at random or in turn)
drawnAtRandom = True

[mcKL]
### int[1,] :: default maximum number of iterations of the Kullback-Leibler divergence computed by Monte Carlo sampling
maxIter = 10000000
### float[0,] :: default threshold on the error to stop the Monte Carlo computation of the Kullback-Leibler divergence
epsilon = 1e-5
### float[0,] :: default threshold on the rate of the error to stop the Monte Carlo computation of the Kullback-Leibler divergence
minEpsilonRate = 1e-10
### int[1,] :: default number of samples between two checks of the stopping criteria of the Monte Carlo computation of the Kullback-Leibler divergence
periodSize = 200
### bool :: default verbosity of the Monte Carlo computation of the Kullback-Leibler divergence
verbosity = False
### float]0,] :: default maximum time (in seconds) of the Monte Carlo computation of the Kullback-Leibler divergence
maxTime = 6000.0

[CNLoopy]
### int[1,] :: default maximum number of iterations of the loopy propagation of credal networks (L2U)
maxIter = 100
### float[0,] :: default threshold on the error to stop the loopy propagation of credal networks (L2U)
epsilon = 1e-8
### float[0,] :: default threshold on the rate of the error to stop the loopy propagation of credal networks (L2U)
minEpsilonRate = 1e-10
### int[1,] :: default number of iterations between two checks of the stopping criteria of the loopy propagation of credal networks (L2U)
periodSize = 1
### bool :: default verbosity of the loopy propagation of credal networks (L2U)
verbosity = False

[CNMontecarlo]
### float]0,] :: default maximum time (in seconds) of the Monte Carlo sampling of credal networks
maxTime = 60.0
### int[1,] :: default number of samples between two checks of the stopping criteria of the Monte Carlo sampling of credal networks
periodSize = 1000

# Default parameters of the learning algorithms (BNLearner, KTBNLearner, ...).
[learning]
### MIIC|PC|FCI|GreedyHillClimbing|ExtendedGreedyHillClimbing|LocalSearchWithTabuList|GreedyThickThinning :: default structure-learning algorithm of the learners when none is selected explicitly (K2 is not available here since it needs an order)
BNLearnerPreferredAlgo = MIIC
### float]0,1[ :: default threshold on the p-value of the independence tests of the constraint-based algorithms (PC, FCI)
alpha = 0.05
### bool :: FCI learnDAG/learnPDAG when the representative graph of the learned PAG has a directed cycle (the PAG is not valid): raise InvalidArgument if True, else use the former approximation (the Meek rules on the PAG seen as a mixed graph)
fciErrorOnInvalidPAG = False
### bool :: constraint-based algorithms (PC, FCI, MIIC), learnDAG/learnBN when the learned DAG has a node with more parents than the maximum indegree (the edges kept by the independence tests are never removed): raise OperationNotAllowed if True, else return the DAG (with a warning in pyAgrum)
errorOnExceededMaxIndegree = True
### float[0,] :: default weight of the priors (BDeu, smoothing, Dirichlet) when it is not given to the learner
priorWeight = 1.0
### float[0,1] :: default noise (in [0,1]) added by the EM algorithm to the initial parameters when it is not given to the learner
emNoise = 0.1
### int[1,] :: default size of the tabu list of the local search with tabu list when it is not given to the learner
tabuListSize = 100
### int[0,] :: default number of consecutive decreasing changes tolerated by the local search with tabu list when it is not given to the learner
tabuNbDecrease = 2

# Default parameters of the graph algorithms.
[graph]
### int[0,] :: largest undirected component (number of nodes) oriented with a minimal total size of the CPTs by graph::orientAsDAG (time polynomial in its size); the larger ones are oriented by a greedy heuristic (0: always greedy)
orientAsDAGExactMaxSize = 100

# Display of the aGrUM objects in the console.
[tensor]
### int[1,] :: number of rows displayed at the beginning and at the end of a tensor in the console (at least 1) ; the middle rows are summarized
maxRowsConsole = 6
### int[6,] :: width of the columns of the values of a tensor in the console (at least 6) ; the values are displayed with (width - 5) decimals
columnWidthConsole = 9

# Look of the graphs produced by the toDot() methods (graphviz, in the notebooks and elsewhere). These
# sections are shared with pyAgrum, whose defaults add the keys that need matplotlib (color maps,
# inference graphs, image formats...). A font color can be 'adaptive': black or white, according to the
# brightness of the background color it is drawn on.
[dot]
### str :: default size (in inches) of a graph (graphviz size, e.g. "5" or "12!" for exact size)
graphSize = 5
### TB|LR :: direction of the graph layout (top-bottom or left-right)
graphRankDir = TB
### dot|neato|fdp|sfdp|twopi|circo|nop|nop2|osage|patchwork :: graphviz layout engine
graphLayout = dot
### str :: default color of the arcs and edges of a graph
arcColor = #4A4A4A
### str :: default background color of the nodes
nodeBgColor = #404040
### str :: default font color of the nodes ('adaptive' = black or white according to the background color)
nodeFgColor = adaptive
### str :: background color of the chain components (nodes linked by undirected edges) of a partially directed graph
chainComponentBgColor = #C9D6E3
### str :: color of the compelled arcs (arcs shared by all the DAGs of the class) of a CPDAG, an MPDAG or an essential graph (empty: the color of the arcs)
compelledArcColor = red
### str :: color of the bidirected edges (<->) of a marked graph such as a PAG (empty: the color of the arcs)
bidirectedEdgeColor =
### str :: color of the edges with a circle mark (o->, o-o) of a marked graph such as a PAG (empty: the color of the arcs)
circleMarkEdgeColor =

[junctionTree]
### str :: size (in inches) of a junction tree (graphviz size, e.g. "10" or "12!")
graphSize = 10
### bool :: show the variable names in the cliques of a junction tree
withNames = True
### str :: background color of the separators of a junction tree
separatorBgColor = palegreen
### str :: font color of the separators of a junction tree ('adaptive' = black or white according to the background color)
separatorFgColor = adaptive
### int[1,] :: font size of the separators of a junction tree
separatorFontSize = 8
### str :: background color of the cliques of a junction tree
cliqueBgColor = burlywood
### str :: font color of the cliques of a junction tree ('adaptive' = black or white according to the background color)
cliqueFgColor = adaptive
### int[1,] :: font size of the cliques of a junction tree
cliqueFontSize = 10
### float]0,] :: scale of the cliques in a junction tree map
mapCliqueScale = 0.3
### float]0,] :: scale of the separators in a junction tree map
mapSepScale = 0.1
### float]0,] :: length of the edges in a junction tree map
mapEdgeLen = 1
### str :: size (in inches) of a junction tree map (graphviz size, e.g. "10" or "12!")
mapSize = 10

[markovRandomField]
### graph|factorgraph :: default view for a Markov random field
view = factorgraph

