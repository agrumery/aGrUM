variables:
  LINUX_AARCH_IMAGE: "agrumery/manylinux_2_28_aarch64"
  LINUX_64_IMAGE: "agrumery/manylinux_2_28_x86_64"
  LINUX_NIGHTLY_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_nightly_wheels_linux.sh"
  LINUX_BUILD: "wrappers/pyagrum/wheelhouse/build_linux.sh"
  LINUX_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_wheels_linux.sh"
  LINUX_TEST: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_linux.sh"
  OSX_BUILD: "wrappers/pyagrum/wheelhouse/build_macos.sh"
  OSX_ARM_BUILD: "wrappers/pyagrum/wheelhouse/build_macos_arm.sh"
  OSX_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_wheels_macos.sh"
  OSX_TEST: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_macos.sh"
  OSX_WHEELHOUSE_ARM: "wrappers/pyagrum/wheelhouse/build_wheels_macos_arm.sh"
  OSX_TEST_ARM: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_macos_arm.sh"
  WINDOWS_BUILD: "wrappers/pyagrum/wheelhouse/build_windows.ps1"
  WINDOWS_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_wheels_windows.ps1"
  WINDOWS_TEST: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_windows.ps1"
  WINDOWS_CONDA_FORGE_TEST: "wrappers/pyagrum/wheelhouse/test_conda_forge_windows.ps1"
  BUILD_DOC: "wrappers/pyagrum/wheelhouse/build_doc.sh"

stages:
  - windows-pyagrum-priority
  - aGrUM
  - pyAgrum
  - build-wheels
  - test-wheels
  - deploy

################################################################################
#                              TEMPLATES                                       #
################################################################################

.main_template: &main_template
  stage: aGrUM
  retry: 1
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - when: always

.mac_win_main_template: &mac_win_main_template
  stage: aGrUM
  retry: 1
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Windows retry policy: only retry on infrastructure failures. A genuine
# compile/link error (e.g. LNK2019) would fail again and just burn another
# full build on the small shared gumwin pool.
.windows_retry: &windows_retry
  max: 1
  when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - scheduler_failure

# Windows, every branch push: the small set of jobs covering the two Windows
# configurations actually shipped (PyPI wheel = MSVC 2022 static,
# conda-forge = MSVC 2022 BUILD_SHARED_LIBS=ON) plus C++ aGrUM.
# Windows-only link errors (dllexport/dllimport mismatches, see config.h.in)
# have repeatedly slipped through macOS/Linux push CI.
.windows_main_template: &windows_main_template
  stage: aGrUM
  retry: *windows_retry
  interruptible: true
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Windows, MR / master / tags / web / schedule only: other compilers
# (MSVC 2019, MinGW), other Python versions, conda-forge static variant.
# Kept off plain branch pushes so the gumwin pool is not saturated.
.windows_mr_template: &windows_mr_template
  stage: aGrUM
  retry: *windows_retry
  interruptible: true
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.wheel_rules: &wheel_rules
  rules:
    - if: '$WHEELS_ONLY == "true"'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.extended_template: &extended_template
  <<: *wheel_rules
  retry: 1
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}"
    when: on_success
    expire_in: 1 week
    paths:
      - wheels/*.whl

.linux_x86_64_build_template: &linux_x86_64_build_template
  <<: *main_template
  tags:
    - docker
    - gumlin

.linux_aarch64_build_template: &linux_aarch64_build_template
  <<: *main_template
  tags:
    - docker
    - aarch

.linux_x86_64_wheel_template: &linux_x86_64_wheel_template
  <<: *extended_template
  image: $LINUX_64_IMAGE
  tags:
    - docker
    - gumlin

.linux_aarch64_wheel_template: &linux_aarch64_wheel_template
  <<: *extended_template
  image: $LINUX_AARCH_IMAGE
  tags:
    - docker
    - aarch

.macos_build_template: &macos_build_template
  <<: *extended_template
  tags:
    - macos
    - conda
  cache:
    key: macos
    paths:
      - build/

.macos_arm_build_template: &macos_arm_build_template
  <<: *extended_template
  tags:
    - aarch
    - osx
  cache:
    key: aarch
    paths:
      - build/

.windows_build_template: &windows_build_template
  <<: *extended_template
  tags:
    - gumwin
    - conda
  cache:
    key: mvsc
    paths:
      - build/

################################################################################
#                                SCRIPTS                                       #
################################################################################

.windows_wheel_script: &windows_wheel_script
  - powershell -File $WINDOWS_WHEELHOUSE -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -CONDA_ENV $CONDA_ENV

.windows_build_script: &windows_build_script
  - powershell -File $WINDOWS_BUILD -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -CONDA_ENV $CONDA_ENV -TARGET $TARGET -COMPILER $COMPILER

.windows_64_test_script: &windows_64_test_script
  - powershell -File $WINDOWS_TEST -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -PYTHON_VERSION $PYTHON_VERSION

.windows_conda_forge_script: &windows_conda_forge_script
  - powershell -File $WINDOWS_CONDA_FORGE_TEST -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -BUILD_SHARED_LIBS $BUILD_SHARED_LIBS

################################################################################
#                               ON PUSH                                        #
################################################################################

# --- Linux x86_64 ---
linux_agrum_x86_64:
  <<: *linux_x86_64_build_template
  image: $LINUX_64_IMAGE
  script:
    - bash $LINUX_BUILD aGrUM cp310-cp310

linux_pyagrum_x86_64_py310:
  <<: *linux_x86_64_build_template
  stage: pyAgrum
  needs: []
  image: $LINUX_64_IMAGE
  script:
    - bash $LINUX_BUILD pyAgrum cp310-cp310

linux_pyagrum_x86_64_py314:
  <<: *linux_x86_64_build_template
  stage: pyAgrum
  needs: []
  image: $LINUX_64_IMAGE
  script:
    - bash $LINUX_BUILD pyAgrum cp314-cp314

# --- Linux aarch64 ---
linux_agrum_aarch64:
  <<: *linux_aarch64_build_template
  image: $LINUX_AARCH_IMAGE
  script:
    - bash $LINUX_BUILD aGrUM cp310-cp310

linux_pyagrum_aarch64_py310:
  <<: *linux_aarch64_build_template
  stage: pyAgrum
  needs: []
  image: $LINUX_AARCH_IMAGE
  script:
    - bash $LINUX_BUILD pyAgrum cp310-cp310

linux_pyagrum_aarch64_py314:
  <<: *linux_aarch64_build_template
  stage: pyAgrum
  needs: []
  image: $LINUX_AARCH_IMAGE
  script:
    - bash $LINUX_BUILD pyAgrum cp314-cp314

# --- MacOS ---
macos_agrum:
  <<: *mac_win_main_template
  stage: aGrUM
  tags: ["macos", "conda"]
  variables: { PYTHON_VERSION: "py310", TARGET: "aGrUM" }
  script:
    - bash $OSX_BUILD $PYTHON_VERSION $TARGET

macos_pyagrum_py310:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["macos", "conda"]
  variables: { PYTHON_VERSION: "py310", TARGET: "pyAgrum" }
  script:
    - bash $OSX_BUILD $PYTHON_VERSION $TARGET

macos_pyagrum_py314:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["macos", "conda"]
  variables: { PYTHON_VERSION: "py314", TARGET: "pyAgrum" }
  script:
    - bash $OSX_BUILD $PYTHON_VERSION $TARGET

# --- MacOS ARM ---
macos_arm_agrum:
  <<: *mac_win_main_template
  stage: aGrUM
  tags: ["aarch", "osx"]
  variables: { PYTHON_VERSION: "py314", TARGET: "aGrUM" }
  script:
    - bash $OSX_ARM_BUILD $PYTHON_VERSION $TARGET

macos_arm_pyagrum_py310:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["aarch", "osx"]
  variables: { PYTHON_VERSION: "py310", TARGET: "pyAgrum" }
  script:
    - bash $OSX_ARM_BUILD $PYTHON_VERSION $TARGET

macos_arm_pyagrum_py314:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["aarch", "osx"]
  variables: { PYTHON_VERSION: "py314", TARGET: "pyAgrum" }
  script:
    - bash $OSX_ARM_BUILD $PYTHON_VERSION $TARGET

# --- Windows ---
# The pyAgrum Windows jobs run in their own stage (windows-pyagrum-priority,
# declared before aGrUM in the top-level `stages:` list) even though they need
# nothing from it: all Windows jobs share the same small "gumwin" runner pool,
# and GitLab assigns job IDs -- and with them, FIFO pickup priority on a shared
# runner pool -- by STAGE INDEX first, not by a job's textual position within
# the YAML file: reordering jobs within the same stage has no effect on pickup
# order, only a genuinely earlier stage index does.
# `needs: []` only affects readiness (lets these jobs start without waiting
# for the aGrUM stage to finish), not this ID-assignment/pickup ordering.
#
# BUILD_SHARED_LIBS=ON is a SUPPORTED Windows configuration: the conda-forge
# feedstock ships aGrUM as shared libraries (agrumBASE.dll, agrumBN.dll, ...)
# because downstream projects link against them. Every symbol used across a
# DLL boundary (including from SWIG %extend helpers) must therefore carry the
# right GUM_PUBLIC_<MODULE> export macro. windows_conda_forge_dynamic checks
# this on every push.

# ---- Every branch push ----

windows_conda_forge_dynamic:
  <<: *windows_main_template
  stage: windows-pyagrum-priority
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, BUILD_SHARED_LIBS: "ON" }
  script:
    - *windows_conda_forge_script

windows_pyagrum_2022_py310:
  <<: *windows_main_template
  stage: windows-pyagrum-priority
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, CONDA_ENV: "py310", TARGET: "pyAgrum", COMPILER: "mvsc22" }
  script:
    - *windows_build_script

windows_agrum_2022:
  <<: *windows_main_template
  stage: aGrUM
  # needs: [] so this job doesn't get skipped when windows-pyagrum-priority
  # fails -- without it, a plain stage-sequenced job with no explicit needs
  # is cancelled outright (skipped, never started) as soon as any job in an
  # earlier stage fails.
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, CONDA_ENV: "py310", TARGET: "aGrUM", COMPILER: "mvsc22" }
  script:
    - *windows_build_script

# ---- MR / master / tags / web / schedule only ----

windows_conda_forge_static:
  <<: *windows_mr_template
  stage: windows-pyagrum-priority
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, BUILD_SHARED_LIBS: "OFF" }
  script:
    - *windows_conda_forge_script

windows_pyagrum_2022_py314:
  <<: *windows_mr_template
  stage: windows-pyagrum-priority
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, CONDA_ENV: "py314", TARGET: "pyAgrum", COMPILER: "mvsc22" }
  script:
    - *windows_build_script

windows_pyagrum_mingw_py314:
  <<: *windows_mr_template
  stage: windows-pyagrum-priority
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MINGW_GUMWIN, CONDA_ENV: "py314-mingw", TARGET: "pyAgrum", COMPILER: "mingw64" }
  script:
    - *windows_build_script

windows_agrum_2019:
  <<: *windows_mr_template
  stage: aGrUM
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC19_GUMWIN, CONDA_ENV: "py310", TARGET: "aGrUM", COMPILER: "mvsc19" }
  script:
    - *windows_build_script

# Static aGrUM under mingw64 (build_windows.ps1 passes --static_lib): same
# coverage as windows_agrum_2019/2022 but on a different compiler/toolchain.
# Shared-library coverage on Windows is provided by windows_conda_forge_dynamic.
windows_agrum_mingw:
  <<: *windows_mr_template
  stage: aGrUM
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MINGW_GUMWIN, CONDA_ENV: "py314-mingw", TARGET: "aGrUM", COMPILER: "mingw64" }
  script:
    - *windows_build_script

################################################################################
#                            BUILD WHEELS                                      #
################################################################################

linux_x86_64_wheel_py310_sabi_off:
  <<: *linux_x86_64_wheel_template
  stage: build-wheels
  needs: []
  script:
    - bash $LINUX_WHEELHOUSE cp310-cp310 --stable_abi_off

linux_x86_64_wheel_py310:
  <<: *linux_x86_64_wheel_template
  stage: build-wheels
  needs: []
  script:
    - bash $LINUX_WHEELHOUSE cp310-cp310

linux_x86_64_nightly_wheel_py310:
  <<: *linux_x86_64_wheel_template
  stage: build-wheels
  needs: []
  script:
    - bash $LINUX_NIGHTLY_WHEELHOUSE cp310-cp310

linux_aarch64_wheel_py310_sabi_off:
  <<: *linux_aarch64_wheel_template
  stage: build-wheels
  needs: []
  script:
    - bash $LINUX_WHEELHOUSE cp310-cp310 --stable_abi_off

linux_aarch64_wheel_py310:
  <<: *linux_aarch64_wheel_template
  stage: build-wheels
  needs: []
  script:
    - bash $LINUX_WHEELHOUSE cp310-cp310

linux_aarch64_nightly_wheel_py310:
  <<: *linux_aarch64_wheel_template
  stage: build-wheels
  needs: []
  script:
    - bash $LINUX_NIGHTLY_WHEELHOUSE cp310-cp310

osx_wheel_py310:
  <<: *macos_build_template
  stage: build-wheels
  needs: []
  script:
    - bash $OSX_WHEELHOUSE py310

osx_arm_wheel_py310:
  <<: *macos_arm_build_template
  stage: build-wheels
  needs: []
  script:
    - bash $OSX_WHEELHOUSE_ARM py310

windows_wheel_py310:
  <<: *windows_build_template
  stage: build-wheels
  needs: []
  variables:
    PATH: $PATH_MVSC22_GUMWIN
    CONDA_ENV: "py310"
  script:
    - *windows_wheel_script

################################################################################
#                            TEST WHEELS (MATRIX)                              #
################################################################################

linux_pyagrum_wheel_x86_64_tests:
  <<: *wheel_rules
  stage: test-wheels
  image: $LINUX_64_IMAGE
  tags: ["linux", "docker", "manylinux1"]
  retry: 1
  needs:
    - job: linux_x86_64_wheel_py310
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp310", "cp311", "cp312", "cp313", "cp314"]
  script:
    - bash $LINUX_TEST ${PYTHON_VERSION}-${PYTHON_VERSION}

linux_pyagrum_wheel_aarch64_tests:
  <<: *wheel_rules
  stage: test-wheels
  image: $LINUX_AARCH_IMAGE
  tags: ["aarch", "docker", "linux"]
  retry: 1
  needs:
    - job: linux_aarch64_wheel_py310
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp310", "cp311", "cp312", "cp313", "cp314"]
  script:
    - bash $LINUX_TEST ${PYTHON_VERSION}-${PYTHON_VERSION}

macos_pyagrum_tests:
  <<: *wheel_rules
  stage: test-wheels
  tags: ["macos", "python3"]
  retry: 1
  needs:
    - job: osx_wheel_py310
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["py310", "py311", "py312", "py313", "py314"]
  script:
    - bash $OSX_TEST $PYTHON_VERSION

macos_arm_pyagrum_tests:
  <<: *wheel_rules
  stage: test-wheels
  tags: ["aarch", "pyenv", "osx"]
  retry: 1
  needs:
    - job: osx_arm_wheel_py310
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["py310", "py311", "py312", "py313", "py314"]
  script:
    - bash $OSX_TEST_ARM $PYTHON_VERSION

windows_64_pyagrum_tests:
  <<: *wheel_rules
  stage: test-wheels
  tags: ["gumwin"]
  retry: 1
  needs:
    - job: windows_wheel_py310
      artifacts: true
  variables:
    PATH: $PATH_MVSC22_GUMWIN
  parallel:
    matrix:
      - PYTHON_VERSION: ["py310", "py311", "py312", "py313", "py314"]
  script:
    - *windows_64_test_script

################################################################################
#                                  DEPLOY                                      #
################################################################################

linux_build:
  image: agrumery/ubuntu
  stage: deploy
  tags: ["docker", "linux"]
  cache:
    key: linux
    paths:
      - build/
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_TAG && $CI_PROJECT_PATH == "agrumery/aGrUM"'
  script:
    - apt-get install -y curl
    - curl -X POST -F token=${AGRUM_DEPLOY_TOKEN} -F ref=master -F "variables[AGRUM_TAG]=${CI_COMMIT_TAG}" -F "variables[AGRUM_BUILD]=1" -F "variables[DEPLOY_TO_PYPI]=TRUE" -F "variables[DEPLOY_DOC]=TRUE"  https://gitlab.com/api/v4/projects/4935470/trigger/pipeline
  retry: 1

build_doc:
  <<: *linux_x86_64_wheel_template
  stage: deploy
  image: agrumery/ubuntu_py310
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - bash $BUILD_DOC