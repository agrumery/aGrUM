variables:
  LINUX_AARCH_IMAGE: "agrumery/manylinux_2_28_aarch64"
  LINUX_64_IMAGE: "agrumery/manylinux_2_28_x86_64"
  LINUX_NIGHTLY_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_nightly_wheels_linux.sh"
  LINUX_BUILD: "wrappers/pyagrum/wheelhouse/build_linux.sh"
  LINUX_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_wheels_linux.sh"
  LINUX_TEST: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_linux.sh"
  OSX_BUILD: "wrappers/pyagrum/wheelhouse/build_macos.sh"
  OSX_ARM_BUILD: "wrappers/pyagrum/wheelhouse/build_macos_arm.sh"
  OSX_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_wheels_macos.sh"
  OSX_TEST: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_macos.sh"
  OSX_WHEELHOUSE_ARM: "wrappers/pyagrum/wheelhouse/build_wheels_macos_arm.sh"
  OSX_TEST_ARM: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_macos_arm.sh"
  WINDOWS_BUILD: "wrappers/pyagrum/wheelhouse/build_windows.ps1"
  WINDOWS_WHEELHOUSE: "wrappers/pyagrum/wheelhouse/build_wheels_windows.ps1"
  WINDOWS_TEST: "wrappers/pyagrum/wheelhouse/scripts/test_wheel_windows.ps1"
  WINDOWS_CONDA_FORGE_TEST: "wrappers/pyagrum/wheelhouse/test_conda_forge_windows.ps1"
  BUILD_DOC: "wrappers/pyagrum/wheelhouse/build_doc.sh"
  # Oldest supported macOS: CMake/clang compile for it (ignored on Linux and Windows), so that
  # a use of a newer macOS API fails here and not only at release time. Must be the same value
  # as MACOSX_DEPLOYMENT_TARGET in aGrUM-deploy/.gitlab-ci.yml (release wheels).
  # At least 13.3: pyAgrum uses std::to_chars(double).
  MACOSX_DEPLOYMENT_TARGET: "14.0"

# [NEO-2] a new commit on a branch cancels the interruptible jobs of the
# previous pipeline of that branch; tags, schedules and master never are.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
    - if: $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH == "master"
      auto_cancel:
        on_new_commit: none
    # A push to a branch that has an open MR would otherwise create BOTH a
    # branch pipeline and an MR pipeline, running the push jobs twice (incl.
    # 3 jobs on the small gumwin pool). The MR pipeline already contains them.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

stages:
  - aGrUM
  - pyAgrum
  - build-wheels
  - test-wheels
  - doc
  - deploy

################################################################################
#                              TEMPLATES                                       #
################################################################################

# [NEO-1] Retry policy for ALL jobs (was `.windows_retry`, Windows only): only
# retry on infrastructure failures. A genuine compile/link/test error would
# fail again and just burn another full build on a shared runner.
.infra_retry: &infra_retry
  max: 1
  when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - scheduler_failure

.main_template: &main_template
  stage: aGrUM
  retry: *infra_retry # [NEO-1] was: retry: 1
  interruptible: true # [NEO-2]
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - when: on_success

.mac_win_main_template: &mac_win_main_template
  stage: aGrUM
  retry: *infra_retry # [NEO-1] was: retry: 1
  interruptible: true # [NEO-2]
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Windows, every branch push: the small set of jobs covering the two Windows
# configurations actually shipped (PyPI wheel = MSVC 2022 static,
# conda-forge = MSVC 2022 BUILD_SHARED_LIBS=ON) plus C++ aGrUM.
# Windows-only link errors (dllexport/dllimport mismatches, see config.h.in)
# have repeatedly slipped through macOS/Linux push CI.
.windows_main_template: &windows_main_template
  stage: aGrUM
  retry: *infra_retry
  interruptible: true
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Windows, MR / master / tags / web / schedule only: other compilers
# (MSVC 2019, MinGW), other Python versions, conda-forge static variant.
# Kept off plain branch pushes so the gumwin pool is not saturated.
.windows_mr_template: &windows_mr_template
  stage: aGrUM
  retry: *infra_retry
  interruptible: true
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.wheel_rules: &wheel_rules
  rules:
    - if: '$WHEELS_ONLY == "true"'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# [NEO-5] nightly wheels: not on MR pipelines, plain master pushes nor tags
# (a release tag ships the regular wheels, not the nightly ones).
.nightly_wheel_rules:
  rules: &nightly_wheel_rules
    - if: '$WHEELS_ONLY == "true"'
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

.extended_template: &extended_template
  <<: *wheel_rules
  retry: *infra_retry # [NEO-1] was: retry: 1
  interruptible: true # [NEO-2]
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}"
    when: on_success
    expire_in: 1 week
    paths:
      - wheels/*.whl

# pip cache for the Linux docker jobs (every job reinstalls the test
# requirements: jupyter, playwright, xgboost... and, on 3.15, builds pyyaml
# from its sdist). Only the docker jobs: on the macOS/Windows shell runners
# pip's per-user cache already persists between jobs, whereas a cache inside
# $CI_PROJECT_DIR would be wiped by the git clean of every job.
# `act clean` does not touch .cache/.
.linux_pip_variables: &linux_pip_variables
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.linux_x86_64_pip_cache: &linux_x86_64_pip_cache
  key: pip-manylinux-x86_64
  paths:
    - .cache/pip

.linux_aarch64_pip_cache: &linux_aarch64_pip_cache
  key: pip-manylinux-aarch64
  paths:
    - .cache/pip

.linux_x86_64_build_template: &linux_x86_64_build_template
  <<: *main_template
  image: $LINUX_64_IMAGE
  variables: *linux_pip_variables
  cache: *linux_x86_64_pip_cache
  tags:
    - docker
    - gumlin

.linux_aarch64_build_template: &linux_aarch64_build_template
  <<: *main_template
  image: $LINUX_AARCH_IMAGE
  variables: *linux_pip_variables
  cache: *linux_aarch64_pip_cache
  tags:
    - docker
    - aarch

.linux_x86_64_wheel_template: &linux_x86_64_wheel_template
  <<: *extended_template
  stage: build-wheels
  needs: []
  image: $LINUX_64_IMAGE
  variables: *linux_pip_variables
  cache: *linux_x86_64_pip_cache
  tags:
    - docker
    - gumlin

.linux_aarch64_wheel_template: &linux_aarch64_wheel_template
  <<: *extended_template
  stage: build-wheels
  needs: []
  image: $LINUX_AARCH_IMAGE
  variables: *linux_pip_variables
  cache: *linux_aarch64_pip_cache
  tags:
    - docker
    - aarch

# [NEO-4] `cache: build/` removed from the three templates below: the scripts
# start with `act clean`, which deletes build/, so the cache was never used.
.macos_build_template: &macos_build_template
  <<: *extended_template
  tags:
    - macos
    - conda

.macos_arm_build_template: &macos_arm_build_template
  <<: *extended_template
  tags:
    - aarch
    - osx

.windows_build_template: &windows_build_template
  <<: *extended_template
  tags:
    - gumwin
    - conda

# Wheel tests. The macOS/Windows test jobs use the same runner tags as the
# matching build jobs (they were on "python3"/"pyenv"/bare "gumwin" before,
# although every test script does `conda activate`): the conda envs
# py311..py315 then only have to exist on one set of runners.
# The test scripts only use these envs as base interpreters: each job tests
# the wheel in its own throwaway venv (concurrent jobs on the same Python
# version no longer interfere), with fresh dependencies from requirements.txt.
.wheel_test_template: &wheel_test_template
  <<: *wheel_rules
  stage: test-wheels
  retry: *infra_retry # [NEO-1] was: retry: 1
  interruptible: true # [NEO-2]

.linux_x86_64_test_template: &linux_x86_64_test_template
  <<: *wheel_test_template
  image: $LINUX_64_IMAGE
  tags: ["linux", "docker", "manylinux1"]
  variables: *linux_pip_variables
  cache: *linux_x86_64_pip_cache
  script:
    - bash $LINUX_TEST ${PYTHON_VERSION}-${PYTHON_VERSION}

.linux_aarch64_test_template: &linux_aarch64_test_template
  <<: *wheel_test_template
  image: $LINUX_AARCH_IMAGE
  tags: ["aarch", "docker", "linux"]
  variables: *linux_pip_variables
  cache: *linux_aarch64_pip_cache
  script:
    - bash $LINUX_TEST ${PYTHON_VERSION}-${PYTHON_VERSION}

.macos_test_template: &macos_test_template
  <<: *wheel_test_template
  tags: ["macos", "conda"]
  needs:
    - job: osx_wheel_py311
      artifacts: true
  script:
    - bash $OSX_TEST $PYTHON_VERSION

.macos_arm_test_template: &macos_arm_test_template
  <<: *wheel_test_template
  tags: ["aarch", "osx"]
  needs:
    - job: osx_arm_wheel_py311
      artifacts: true
  script:
    - bash $OSX_TEST_ARM $PYTHON_VERSION

.windows_test_template: &windows_test_template
  <<: *wheel_test_template
  tags: ["gumwin", "conda"]
  needs:
    - job: windows_wheel_py311
      artifacts: true
  variables:
    PATH: $PATH_MVSC22_GUMWIN
  script:
    - powershell -File $WINDOWS_TEST -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -PYTHON_VERSION $PYTHON_VERSION

################################################################################
#                                SCRIPTS                                       #
################################################################################

.windows_wheel_script: &windows_wheel_script
  - powershell -File $WINDOWS_WHEELHOUSE -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -CONDA_ENV $CONDA_ENV

.windows_build_script: &windows_build_script
  - powershell -File $WINDOWS_BUILD -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -CONDA_ENV $CONDA_ENV -TARGET $TARGET -COMPILER $COMPILER

.windows_conda_forge_script: &windows_conda_forge_script
  - powershell -File $WINDOWS_CONDA_FORGE_TEST -CI_JOB_ID $CI_JOB_ID -CI_PROJECT_DIR $CI_PROJECT_DIR -BUILD_SHARED_LIBS $BUILD_SHARED_LIBS

################################################################################
#                               ON PUSH                                        #
################################################################################

# [NEO-3] Every job of this file has `needs: []` (except trigger_release, which
# must wait for everything): stages are only labels. No job waits for, or is
# blocked by, an unrelated job of an earlier stage.

# --- Linux x86_64 ---
linux_agrum_x86_64:
  <<: *linux_x86_64_build_template
  needs: [] # [NEO-3]
  script:
    - bash $LINUX_BUILD aGrUM cp311-cp311

linux_pyagrum_x86_64_py311:
  <<: *linux_x86_64_build_template
  stage: pyAgrum
  needs: []
  script:
    - bash $LINUX_BUILD pyAgrum cp311-cp311

linux_pyagrum_x86_64_py315:
  <<: *linux_x86_64_build_template
  stage: pyAgrum
  needs: []
  script:
    - bash $LINUX_BUILD pyAgrum cp315-cp315

# --- Linux aarch64 ---
linux_agrum_aarch64:
  <<: *linux_aarch64_build_template
  needs: [] # [NEO-3]
  script:
    - bash $LINUX_BUILD aGrUM cp311-cp311

linux_pyagrum_aarch64_py311:
  <<: *linux_aarch64_build_template
  stage: pyAgrum
  needs: []
  script:
    - bash $LINUX_BUILD pyAgrum cp311-cp311

linux_pyagrum_aarch64_py315:
  <<: *linux_aarch64_build_template
  stage: pyAgrum
  needs: []
  script:
    - bash $LINUX_BUILD pyAgrum cp315-cp315

# --- MacOS ---
macos_agrum:
  <<: *mac_win_main_template
  stage: aGrUM
  needs: [] # [NEO-3]
  tags: ["macos", "conda"]
  variables: { PYTHON_VERSION: "py311", TARGET: "aGrUM" }
  script:
    - bash $OSX_BUILD $PYTHON_VERSION $TARGET

macos_pyagrum_py311:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["macos", "conda"]
  variables: { PYTHON_VERSION: "py311", TARGET: "pyAgrum" }
  script:
    - bash $OSX_BUILD $PYTHON_VERSION $TARGET

macos_pyagrum_py315:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["macos", "conda"]
  variables: { PYTHON_VERSION: "py315", TARGET: "pyAgrum" }
  script:
    - bash $OSX_BUILD $PYTHON_VERSION $TARGET

# --- MacOS ARM ---
macos_arm_agrum:
  <<: *mac_win_main_template
  stage: aGrUM
  needs: [] # [NEO-3]
  tags: ["aarch", "osx"]
  variables: { PYTHON_VERSION: "py315", TARGET: "aGrUM" }
  script:
    - bash $OSX_ARM_BUILD $PYTHON_VERSION $TARGET

macos_arm_pyagrum_py311:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["aarch", "osx"]
  variables: { PYTHON_VERSION: "py311", TARGET: "pyAgrum" }
  script:
    - bash $OSX_ARM_BUILD $PYTHON_VERSION $TARGET

macos_arm_pyagrum_py315:
  <<: *mac_win_main_template
  stage: pyAgrum
  needs: []
  tags: ["aarch", "osx"]
  variables: { PYTHON_VERSION: "py315", TARGET: "pyAgrum" }
  script:
    - bash $OSX_ARM_BUILD $PYTHON_VERSION $TARGET

# --- Windows ---
# BUILD_SHARED_LIBS=ON is a SUPPORTED Windows configuration: the conda-forge
# feedstock ships aGrUM as shared libraries (agrumBASE.dll, agrumBN.dll, ...)
# because downstream projects link against them. Every symbol used across a
# DLL boundary (including from SWIG %extend helpers) must therefore carry the
# right GUM_PUBLIC_<MODULE> export macro. windows_conda_forge_dynamic checks
# this on every push.

# ---- Every branch push ----

windows_conda_forge_dynamic:
  <<: *windows_main_template
  stage: pyAgrum
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, BUILD_SHARED_LIBS: "ON" }
  script:
    - *windows_conda_forge_script

windows_pyagrum_2022_py311:
  <<: *windows_main_template
  stage: pyAgrum
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, CONDA_ENV: "py311", TARGET: "pyAgrum", COMPILER: "mvsc22" }
  script:
    - *windows_build_script

windows_agrum_2022:
  <<: *windows_main_template
  stage: aGrUM
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, CONDA_ENV: "py311", TARGET: "aGrUM", COMPILER: "mvsc22" }
  script:
    - *windows_build_script

# ---- MR / master / tags / web / schedule only ----

windows_conda_forge_static:
  <<: *windows_mr_template
  stage: pyAgrum
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, BUILD_SHARED_LIBS: "OFF" }
  script:
    - *windows_conda_forge_script

windows_pyagrum_2022_py315:
  <<: *windows_mr_template
  stage: pyAgrum
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC22_GUMWIN, CONDA_ENV: "py315", TARGET: "pyAgrum", COMPILER: "mvsc22" }
  script:
    - *windows_build_script

windows_pyagrum_mingw_py315:
  <<: *windows_mr_template
  stage: pyAgrum
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MINGW_GUMWIN, CONDA_ENV: "py315-mingw", TARGET: "pyAgrum", COMPILER: "mingw64" }
  script:
    - *windows_build_script

windows_agrum_2019:
  <<: *windows_mr_template
  stage: aGrUM
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MVSC19_GUMWIN, CONDA_ENV: "py311", TARGET: "aGrUM", COMPILER: "mvsc19" }
  script:
    - *windows_build_script

# Static aGrUM under mingw64 (build_windows.ps1 passes --static_lib): same
# coverage as windows_agrum_2019/2022 but on a different compiler/toolchain.
# Shared-library coverage on Windows is provided by windows_conda_forge_dynamic.
windows_agrum_mingw:
  <<: *windows_mr_template
  stage: aGrUM
  needs: []
  tags: ["gumwin", "conda"]
  variables: { PATH: $PATH_MINGW_GUMWIN, CONDA_ENV: "py315-mingw", TARGET: "aGrUM", COMPILER: "mingw64" }
  script:
    - *windows_build_script

################################################################################
#                            BUILD WHEELS                                      #
################################################################################

linux_x86_64_wheel_py311_sabi_off:
  <<: *linux_x86_64_wheel_template
  script:
    - bash $LINUX_WHEELHOUSE cp311-cp311 --stable_abi_off

linux_x86_64_wheel_py311:
  <<: *linux_x86_64_wheel_template
  script:
    - bash $LINUX_WHEELHOUSE cp311-cp311

linux_x86_64_nightly_wheel_py311:
  <<: *linux_x86_64_wheel_template
  rules: *nightly_wheel_rules # [NEO-5]
  script:
    - bash $LINUX_NIGHTLY_WHEELHOUSE cp311-cp311

linux_aarch64_wheel_py311_sabi_off:
  <<: *linux_aarch64_wheel_template
  script:
    - bash $LINUX_WHEELHOUSE cp311-cp311 --stable_abi_off

linux_aarch64_wheel_py311:
  <<: *linux_aarch64_wheel_template
  script:
    - bash $LINUX_WHEELHOUSE cp311-cp311

linux_aarch64_nightly_wheel_py311:
  <<: *linux_aarch64_wheel_template
  rules: *nightly_wheel_rules # [NEO-5]
  script:
    - bash $LINUX_NIGHTLY_WHEELHOUSE cp311-cp311

osx_wheel_py311:
  <<: *macos_build_template
  stage: build-wheels
  needs: []
  script:
    - bash $OSX_WHEELHOUSE py311

osx_arm_wheel_py311:
  <<: *macos_arm_build_template
  stage: build-wheels
  needs: []
  script:
    - bash $OSX_WHEELHOUSE_ARM py311

windows_wheel_py311:
  <<: *windows_build_template
  stage: build-wheels
  needs: []
  variables:
    PATH: $PATH_MVSC22_GUMWIN
    CONDA_ENV: "py311"
  script:
    - *windows_wheel_script

################################################################################
#                            TEST WHEELS (MATRIX)                              #
################################################################################

# MR, master and tag pipelines run the SAME tests (full matrices): an MR is the
# last chance to catch a regression before master, and a tag must not discover
# anything the MR did not already see. Only plain branch pushes without an
# open MR get a reduced set (no wheel built or tested at all).

# --- Linux x86_64 ---
linux_pyagrum_wheel_x86_64_tests:
  <<: *linux_x86_64_test_template
  needs:
    - job: linux_x86_64_wheel_py311
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp311", "cp312", "cp313", "cp314", "cp315"]

# The stable-ABI-off wheel is tagged cp311-cp311: only installable on 3.11.
linux_pyagrum_wheel_x86_64_sabi_off_tests:
  <<: *linux_x86_64_test_template
  needs:
    - job: linux_x86_64_wheel_py311_sabi_off
      artifacts: true
  variables:
    <<: *linux_pip_variables
    PYTHON_VERSION: "cp311"

linux_pyagrum_wheel_x86_64_nightly_tests:
  <<: *linux_x86_64_test_template
  rules: *nightly_wheel_rules
  needs:
    - job: linux_x86_64_nightly_wheel_py311
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp311", "cp315"]

# --- Linux aarch64 ---
linux_pyagrum_wheel_aarch64_tests:
  <<: *linux_aarch64_test_template
  needs:
    - job: linux_aarch64_wheel_py311
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp311", "cp312", "cp313", "cp314", "cp315"]

linux_pyagrum_wheel_aarch64_sabi_off_tests:
  <<: *linux_aarch64_test_template
  needs:
    - job: linux_aarch64_wheel_py311_sabi_off
      artifacts: true
  variables:
    <<: *linux_pip_variables
    PYTHON_VERSION: "cp311"

linux_pyagrum_wheel_aarch64_nightly_tests:
  <<: *linux_aarch64_test_template
  rules: *nightly_wheel_rules
  needs:
    - job: linux_aarch64_nightly_wheel_py311
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION: ["cp311", "cp315"]

# --- MacOS ---
macos_pyagrum_tests:
  <<: *macos_test_template
  parallel:
    matrix:
      - PYTHON_VERSION: ["py311", "py312", "py313", "py314", "py315"]

# --- MacOS ARM ---
macos_arm_pyagrum_tests:
  <<: *macos_arm_test_template
  parallel:
    matrix:
      - PYTHON_VERSION: ["py311", "py312", "py313", "py314", "py315"]

# --- Windows ---
windows_64_pyagrum_tests:
  <<: *windows_test_template
  parallel:
    matrix:
      - PYTHON_VERSION: ["py311", "py312", "py313", "py314", "py315"]

################################################################################
#                                   DOC                                        #
################################################################################

# [NEO-3] build_doc builds pyAgrum itself and uses no artifact: it starts at t0
# on gumlin. It sits in its own stage, before deploy, so that trigger_release
# (no `needs`) waits for it: no release with DEPLOY_DOC=TRUE on a broken doc.
build_doc:
  <<: *linux_x86_64_wheel_template
  stage: doc
  needs: [] # [NEO-3]
  image: agrumery/ubuntu_py311
  cache:
    key: pip-ubuntu-py311
    paths:
      - .cache/pip
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # The generated HTML (sphinx RTDDIR, see doc/sphinx/Makefile), to review the
  # doc of an MR without rebuilding it.
  artifacts:
    name: "doc_${CI_COMMIT_REF_NAME}"
    when: on_success
    expire_in: 1 week
    paths:
      - build/pyAgrum/release/wrappers/pyagrum/docs/
  script:
    - bash $BUILD_DOC

################################################################################
#                                  DEPLOY                                      #
################################################################################

# Triggers the release pipeline of the deploy project (PyPI + doc).
# No `needs`: on purpose, it waits for every job of every earlier stage.
# Kept `retry: 1`: a single cheap curl call, where a network hiccup shows up
# as a script failure. [NEO-2] never interruptible: it triggers the release.
# [NEO-4] `cache: build/` removed: this job never builds anything.
trigger_release:
  image: agrumery/ubuntu
  stage: deploy
  tags: ["docker", "linux"]
  interruptible: false
  rules:
    - if: '$WHEELS_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_TAG && $CI_PROJECT_PATH == "agrumery/aGrUM"'
  script:
    - apt-get update -qq && apt-get install -y -qq curl
    # --fail: an HTTP error (bad token, wrong project...) must fail the job
    # instead of being printed and ignored. (Not --fail-with-body: needs
    # curl >= 7.76, unknown in agrumery/ubuntu.)
    - curl --fail --show-error -X POST -F token=${AGRUM_DEPLOY_TOKEN} -F ref=master -F "variables[AGRUM_TAG]=${CI_COMMIT_TAG}" -F "variables[AGRUM_BUILD]=1" -F "variables[DEPLOY_TO_PYPI]=TRUE" -F "variables[DEPLOY_DOC]=TRUE"  https://gitlab.com/api/v4/projects/4935470/trigger/pipeline
  retry: 1
