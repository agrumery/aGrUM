# Defaults of pyAgrum, added to the defaults of aGrUM (src/agrum/base/core/configuration/defaults.ini,
# which documents the syntax: '### type :: documentation' metadata lines) when pyAgrum is compiled:
# the two files are concatenated by cmake and embedded in the library (see Modules.agrum.cmake).
# These sections are specific to pyAgrum: this file must not reopen a section of the aGrUM defaults.

[notebook]
### int[0,] :: number of visible digits when displaying a tensor
tensor_visible_digits = 4
### bool :: use a background color gradient for the values in a tensor
tensor_with_colors = True
### str :: color for the minimal value of a tensor
tensor_color_0 = #FF7F64
### str :: color for the maximal value of a tensor
tensor_color_1 = #7FFF64
### bool :: display the values of a tensor as fractions when possible
tensor_with_fraction = False
### int[1,] :: maximal denominator for the fraction representation in a tensor
tensor_fraction_limit = 50
### float]0,1[ :: maximal rounding error when looking for a fraction representation
tensor_fraction_round_error = 1e-6
### bool :: use LaTeX to render the fractions in a tensor
tensor_fraction_with_latex = True

# for histograms with matplotlib
### int[0,] :: number of visible digits in horizontal histograms
histogram_horizontal_visible_digits = 2
### int[0,] :: number of visible digits in vertical histograms
histogram_vertical_visible_digits = 2
### int[1,] :: maximal domain size for a horizontal histogram (vertical above)
histogram_horizontal_threshold = 8
### int[1,] :: domain size above which a histogram becomes a line plot
histogram_line_threshold = 40
### str :: color of the histogram bars
histogram_color = darkseagreen
### str :: color of the edges of the histogram bars
histogram_edge_color = darkgreen
### bool :: display probabilities as percentages in histograms
histogram_use_percent = True
### histogram|bar :: visualisation of the histogram for a discretized variable
histogram_discretized_visualisation = histogram
### float]0,] :: scale for the histogram of a discretized variable
histogram_discretized_scale = 1.0

# pdf export
### int[0,] :: horizontal margin (in points) when exporting to pdf
export_pdf_margin_x = 50
### int[0,] :: vertical margin (in points) when exporting to pdf
export_pdf_margin_y = 37

### compact|classical :: mode for displaying histograms
histogram_mode = compact
### float]0,1[ :: probabilities below this threshold are truncated in histograms
histogram_epsilon = 1e-8

### merge|revmerge|nomerge :: how to display the parent values in a tensor
tensor_parent_values = merge

### str :: face color of the matplotlib figures (see matplotlib)
figure_facecolor = #E0E0E0

# flow configuration (layout of multiple items in a notebook cell)
### str :: background color of an item in a flow
flow_background_color = transparent
### str :: border color of an item in a flow
flow_border_color = transparent
### int[0,] :: border width (in pixels) of an item in a flow
flow_border_width = 0

### svg|png :: format used to render graphs in a notebook
graph_format = svg

### bool :: display the inference time below an inference graph
show_inference_time = True

# theming
### str :: default color of the arcs
arc_color = #4A4A4A
### str :: default background color of the nodes
node_bgcolor = #404040
### str :: default font color of the nodes
node_fgcolor = white
### str :: background color of a node with evidence
evidence_bgcolor = sandybrown
### str :: font color of a node with evidence
evidence_fgcolor = black
### str :: matplotlib color map for the nodes
node_cmap = Pastel1
### str :: matplotlib color map for the arcs
arc_cmap = BuGn
### str :: matplotlib color map for the edges
edge_cmap = BuGn

### str :: default size (in inches) of a graph (graphviz size, e.g. "5" or "12!" for exact size)
graph_size = 5
### str :: default size (in inches) of a graph during inference (graphviz size, e.g. "8" or "12!")
graph_inference_size = 8

### TB|LR :: direction of the graph layout (top-bottom or left-right)
graph_rankdir = TB
### dot|neato|fdp|sfdp|twopi|circo|nop|nop2|osage|patchwork :: graphviz layout engine
graph_layout = dot

### graph|factorgraph :: default view for a Markov random field
markovrandomfield_view = factorgraph

# junction tree / clique graph
### str :: size (in inches) of a junction tree (graphviz size, e.g. "10" or "12!")
junctiontree_graph_size = 10
### bool :: show the variable names in the cliques of a junction tree
junctiontree_with_names = True
### str :: background color of the separators of a junction tree
junctiontree_separator_bgcolor = palegreen
### str :: font color of the separators of a junction tree
junctiontree_separator_fgcolor = black
### int[1,] :: font size of the separators of a junction tree
junctiontree_separator_fontsize = 8
### str :: background color of the cliques of a junction tree
junctiontree_clique_bgcolor = burlywood
### str :: font color of the cliques of a junction tree
junctiontree_clique_fgcolor = black
### int[1,] :: font size of the cliques of a junction tree
junctiontree_clique_fontsize = 10
### float]0,] :: scale of the cliques in a junction tree map
junctiontree_map_cliquescale = 0.3
### float]0,] :: scale of the separators in a junction tree map
junctiontree_map_sepscale = 0.1
### float]0,] :: length of the edges in a junction tree map
junctiontree_map_edgelen = 1
### str :: size (in inches) of a junction tree map (graphviz size, e.g. "10" or "12!")
junctiontree_map_size = 10

# structural diff between graphs
### str :: style of an arc missing in the compared graph
graphdiff_missing_style = dashed
### str :: color of an arc missing in the compared graph
graphdiff_missing_color = red
### str :: style of an arc absent from the reference graph
graphdiff_overflow_style = dashed
### str :: color of an arc absent from the reference graph
graphdiff_overflow_color = purple
### str :: style of an arc reversed in the compared graph
graphdiff_reversed_style = solid
### str :: color of an arc reversed in the compared graph
graphdiff_reversed_color = purple
### str :: style of an arc identical in both graphs
graphdiff_correct_style = solid
### str :: color of an arc identical in both graphs
graphdiff_correct_color = grey

