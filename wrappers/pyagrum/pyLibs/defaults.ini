default_id_inference_size = 6

### int :: number of visible digits when displaying a utility
utility_visible_digits = 2
### bool :: show the standard deviation together with a utility
utility_show_stdev = True

### bool :: show the loss (negative utility) instead of the utility
utility_show_loss = False

